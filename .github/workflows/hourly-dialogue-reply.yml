name: Hourly Claude dialogue reply

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-dialogue-auto-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate reply when Claude has a new round
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python scripts/auto_reply.py

      - name: Commit and push reply
        run: |
          if git diff --quiet -- DIALOGUE.md; then
            echo "No new reply to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIALOGUE.md
          git commit -m "Add automated ChatGPT dialogue reply"
          git push
